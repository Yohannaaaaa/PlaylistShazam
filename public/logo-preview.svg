<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f5" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="#0a0a0f" />

  <!-- soundwave bars -->
  <g fill="url(#ringGrad)" opacity="0.85">
    <rect x="60" y="230" width="10" height="40" rx="4" />
    <rect x="78" y="205" width="10" height="90" rx="4" />
    <rect x="96" y="185" width="10" height="130" rx="4" />
    <rect x="114" y="215" width="10" height="70" rx="4" />

    <rect x="410" y="230" width="10" height="40" rx="4" />
    <rect x="392" y="205" width="10" height="90" rx="4" />
    <rect x="374" y="185" width="10" height="130" rx="4" />
    <rect x="356" y="215" width="10" height="70" rx="4" />
  </g>

  <!-- ring -->
  <circle cx="240" cy="220" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.7" />

  <!-- note + play glyph -->
  <g>
    <circle cx="200" cy="270" r="34" fill="url(#noteGrad)" />
    <rect x="190" y="150" width="20" height="122" rx="8" fill="url(#noteGrad)" />
    <path d="M210 150 L300 205 L210 260 Z" fill="url(#noteGrad)" />
    <g stroke="#0a0a0f" stroke-width="6" stroke-linecap="round">
      <line x1="235" y1="190" x2="235" y2="220" />
      <line x1="250" y1="180" x2="250" y2="230" />
      <line x1="265" y1="195" x2="265" y2="215" />
    </g>
  </g>

  <!-- wordmark -->
  <text x="240" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="48" fill="url(#textGrad)">
    MyPlaylist
  </text>
  <text x="240" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="15" letter-spacing="3" fill="#c4c4d0">
    PLAY · DISCOVER · LISTEN
  </text>
</svg>
